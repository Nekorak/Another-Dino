<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#9fdcff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Another Dino" />
    <meta name="description" content="Un endless runner 3D pixelat inspirat de dinozaurul din Chrome, făcut pentru telefoane." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.github.com"
    />
    <title>Another Dino</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js",
          "@capacitor/core": "./vendor/capacitor-core.js"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="touch"></div>
    <div id="crt" aria-hidden="true"></div>
    <p id="fatal"></p>

    <div id="hud">
      <div class="buttons">
        <button id="btn-pause" aria-label="Pauză">
          <svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1 1h2v6H1zM5 1h2v6H5z" /></svg>
        </button>
        <button id="btn-sound" aria-label="Sunet">
          <svg viewBox="0 0 8 8" aria-hidden="true">
            <path d="M0 3h2l2-2v6L2 5H0z" />
            <path class="wave" d="M5 2h1v1H5zM6 3h1v2H6zM5 5h1v1H5z" />
            <path class="mute" d="M5 2h1v1H5zM7 2h1v1H7zM6 3h1v2H6zM5 5h1v1H5zM7 5h1v1H7z" />
          </svg>
        </button>
        <button id="btn-fs" aria-label="Ecran complet">
          <svg viewBox="0 0 8 8" aria-hidden="true">
            <path d="M0 0h3v1H1v2H0zM5 0h3v3H7V1H5zM0 5h1v2h2v1H0zM7 5h1v3H5V7h2z" />
          </svg>
        </button>
      </div>
      <div class="score-block">
        <div class="score"><span id="hi">HI 00000</span><span id="score">00000</span></div>
        <div id="runcoins"><span id="runcoins-n">0</span></div>
      </div>
    </div>
    <div id="powerups"></div>
    <div id="mp-hud"></div>
    <div id="split-line" aria-hidden="true"></div>
    <p id="spectate" class="hidden"></p>
    <div id="lan-actions" class="hidden">
      <button id="btn-bomb" class="menu-btn hidden"></button>
      <div id="emotes"></div>
    </div>

    <div id="hints" class="hidden">
      <div class="zone duck"><span class="arrow">↓</span><span id="hint-duck"></span></div>
      <div class="zone jump"><span class="arrow">↑</span><span id="hint-jump"></span></div>
    </div>

    <div id="menu" class="screen">
      <h1>ANOTHER<br />DINO</h1>
      <div class="menu-info">
        <span id="menu-level"></span>
        <span id="menu-best"></span>
        <span id="menu-coins"><span id="menu-coins-n">0</span></span>
      </div>
      <nav id="menu-buttons"></nav>
      <p id="controls-msg" class="small"></p>
      <div id="banner" class="hidden"></div>
    </div>

    <div id="over" class="screen hidden">
      <h2>GAME OVER</h2>
      <p id="over-score" class="big-score"></p>
      <p id="over-record" class="blink"></p>
      <p id="over-coins"></p>
      <p id="over-xp" class="small"></p>
      <div id="over-extra"></div>
      <div id="over-missions"></div>
      <div class="over-buttons">
        <button id="btn-restart" aria-label="Restart">
          <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 5h1v1h-1zM1 6h1v1h-1zM1 7h1v1h-1zM1 8h1v1h-1zM2 3h1v1h-1zM2 4h1v1h-1zM2 5h1v1h-1zM2 6h1v1h-1zM2 7h1v1h-1zM2 8h1v1h-1zM2 9h1v1h-1zM2 10h1v1h-1zM3 2h1v1h-1zM3 3h1v1h-1zM3 4h1v1h-1zM3 5h1v1h-1zM3 8h1v1h-1zM3 9h1v1h-1zM3 10h1v1h-1zM3 11h1v1h-1zM4 2h1v1h-1zM4 3h1v1h-1zM4 10h1v1h-1zM4 11h1v1h-1zM5 1h1v1h-1zM5 2h1v1h-1zM5 3h1v1h-1zM5 10h1v1h-1zM5 11h1v1h-1zM5 12h1v1h-1zM6 1h1v1h-1zM6 2h1v1h-1zM6 11h1v1h-1zM6 12h1v1h-1zM7 0h1v1h-1zM7 1h1v1h-1zM7 2h1v1h-1zM7 3h1v1h-1zM7 4h1v1h-1zM7 11h1v1h-1zM7 12h1v1h-1zM8 1h1v1h-1zM8 2h1v1h-1zM8 3h1v1h-1zM8 10h1v1h-1zM8 11h1v1h-1zM8 12h1v1h-1zM9 2h1v1h-1zM9 10h1v1h-1zM9 11h1v1h-1zM10 8h1v1h-1zM10 9h1v1h-1zM10 10h1v1h-1zM10 11h1v1h-1zM11 6h1v1h-1zM11 7h1v1h-1zM11 8h1v1h-1zM11 9h1v1h-1zM11 10h1v1h-1zM12 6h1v1h-1zM12 7h1v1h-1zM12 8h1v1h-1z" /></svg>
        </button>
        <button id="btn-over-menu" class="menu-btn" data-t="menu"></button>
        <button id="btn-share" class="menu-btn"></button>
      </div>
      <p id="again-msg" class="small"></p>
    </div>

    <div id="paused" class="screen hidden">
      <h2 id="paused-title"></h2>
      <p id="paused-msg" class="blink"></p>
    </div>

    <div id="revive" class="screen hidden">
      <h2 id="revive-title"></h2>
      <p id="revive-timer" class="big-score"></p>
      <div class="over-buttons">
        <button id="btn-revive-yes" class="menu-btn primary"></button>
        <button id="btn-revive-no" class="menu-btn"></button>
      </div>
    </div>

    <div id="egg" class="hidden">
      <div class="egg-box">
        <div class="egg-big" aria-hidden="true"></div>
        <div id="egg-result"></div>
        <button id="egg-ok" class="menu-btn">OK</button>
      </div>
    </div>

    <div id="countdown" class="hidden"></div>
    <div id="tutorial" class="hidden"></div>

    <section id="panel" class="hidden" aria-live="polite">
      <header class="panel-head">
        <button id="panel-back" class="menu-btn" data-t="back"></button>
        <h2 id="panel-title"></h2>
        <span id="panel-coins"><span id="panel-coins-n">0</span></span>
      </header>
      <div id="panel-body"></div>
    </section>

    <div id="toasts" aria-live="polite"></div>
  </body>
</html>
